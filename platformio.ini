; PlatformIO Project Configuration File
; ESP32 WiFi Internet Radio - Pure ESP-IDF v5.3+ FreeRTOS Architecture
; MCU: ESP32-WROOM-32 (240 MHz Dual-Core, No PSRAM)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200

; Upload configuration
upload_speed = 115200
upload_port = COM3

; CPU Frequency
board_build.f_cpu = 240000000L

; Compiler optimization (-O2) & Disable PSRAM on ESP32-WROOM-32
build_flags =
    -O2
    -UBOARD_HAS_PSRAM
    -Iinclude

    -Iinclude